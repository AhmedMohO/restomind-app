<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Card Surface Gradient -->
    <linearGradient id="rm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Central Badge Gradient -->
    <linearGradient id="rm-badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Brand Accent Gradient (Warm Orange / Amber) -->
    <linearGradient id="rm-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Soft Neutral Metals -->
    <linearGradient id="rm-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <filter id="shadow-emblem" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#EA580C" flood-opacity="0.18"/>
    </filter>

    <!-- Subtle Dots Pattern -->
    <pattern id="dot-pattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#CBD5E1" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="24" fill="url(#rm-bg)"/>
  
  <!-- Subtle Grid Texture Overlay -->
  <rect width="400" height="400" rx="24" fill="url(#dot-pattern)"/>

  <!-- Centered Focal Group -->
  <g transform="translate(200, 190)" filter="url(#shadow-card)">
    
    <!-- Outer Ambient Glow Ring -->
    <circle cx="0" cy="0" r="88" fill="#FFF7ED" opacity="0.9"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#FFEDD5" stroke-width="2"/>
    <circle cx="0" cy="0" r="72" fill="url(#rm-badge-bg)" filter="url(#shadow-emblem)"/>

    <!-- Decorative Culinary Utensils in Background -->
    <g stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.3">
      <!-- Fork Left -->
      <path d="M -48 -18 L -48 18 M -53 -18 L -53 -6 C -53 0 -43 0 -43 -6 L -43 -18 M -48 0 L -48 18"/>
      <!-- Spoon Right -->
      <path d="M 48 -18 C 43 -18 43 0 48 0 C 53 0 53 -18 48 -18 Z M 48 0 L 48 18"/>
    </g>

    <!-- Main Food Cloche Icon (Centered in emblem) -->
    <g transform="translate(0, -5)">
      <!-- Plate Base -->
      <ellipse cx="0" cy="30" rx="44" ry="8" fill="url(#rm-metal)"/>
      <ellipse cx="0" cy="27" rx="40" ry="6" fill="#FFFFFF"/>

      <!-- Cloche Dome -->
      <path d="M -34 24 A 34 32 0 0 1 34 24 Z" fill="url(#rm-accent)"/>

      <!-- Cloche Rim Base -->
      <path d="M -37 24 C -37 22, -34 21, -30 21 L 30 21 C 34 21, 37 22, 37 24 C 37 26, 34 27, 30 27 L -30 27 C -34 27, -37 26, -37 24 Z" fill="#C2410C"/>

      <!-- Top Handle Knob -->
      <circle cx="0" cy="-12" r="5.5" fill="#FFF7ED"/>
      <path d="M -2 -9 L -2 -4 L 2 -4 L 2 -4 Z" fill="#EA580C"/>

      <!-- Curved Gloss Highlight -->
      <path d="M -22 10 A 26 26 0 0 1 -5 -16 A 28 28 0 0 0 -17 12 Z" fill="#FFFFFF" opacity="0.38"/>

      <!-- Steam Sparkles -->
      <path d="M -10 -20 C -13 -26, -8 -30, -10 -35" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <path d="M 0 -22 C -3 -28, 3 -32, 0 -38" fill="none" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
      <path d="M 10 -20 C 7 -26, 12 -30, 10 -35" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- Sleek Centered Pill Badge (Separated camera icon & text) -->
    <g transform="translate(0, 75)">
      <rect x="-62" y="-13" width="124" height="26" rx="13" fill="#FFFFFF" opacity="0.95" stroke="#E2E8F0" stroke-width="1"/>
      
      <!-- Camera Icon (Left Side - No overlap with text) -->
      <g opacity="0.75">
        <path d="M -44 -1 C -44 -3, -43 -4, -41 -4 L -40 -4 L -38 -6 L -34 -6 L -32 -4 L -30 -4 C -28 -4, -27 -3, -27 -1 L -27 3 C -28 5, -29 6, -31 6 L -40 6 C -42 6, -44 5, -44 3 Z" fill="none" stroke="#64748B" stroke-width="1.3" stroke-linejoin="round"/>
        <circle cx="-35.5" cy="1" r="2" fill="none" stroke="#64748B" stroke-width="1.3"/>
      </g>

      <!-- Pill Text (Right Side) -->
      <text x="8" y="3.5" font-family="Outfit, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1.2">NO IMAGE</text>
    </g>
  </g>
</svg>
